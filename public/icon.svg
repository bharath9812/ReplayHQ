<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="vaultGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A84FF"/>
      <stop offset="100%" stop-color="#5E5CE6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="#0A0A0C"/>
  <rect x="24" y="24" width="464" height="464" rx="96" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4"/>
  <g filter="url(#glow)">
    <polygon points="216,160 352,256 216,352" fill="url(#vaultGrad)"/>
    <circle cx="256" cy="256" r="160" fill="none" stroke="url(#vaultGrad)" stroke-width="20" stroke-linecap="round" stroke-dasharray="750" stroke-dashoffset="150"/>
  </g>
</svg>
